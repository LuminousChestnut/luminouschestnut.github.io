<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Rhythm Lab · 分数追踪</title>
  <!-- 引入 Google Fonts 中的近似字体 (Futura / Century Gothic 备选) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Poiret+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Josefin Sans', 'Futura', 'Century Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
      --font-heading: 'Poiret One', 'Futura', 'Century Gothic', cursive;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* 深色主题 (默认) */
    body.dark-mode {
      --bg-color: #0d0d0d;
      --panel-bg: #151515;
      --text-main: #e0e0e0;
      --text-secondary: #888;
      --border-color: #333;
      --accent-blue: #0095ff;
      --accent-yellow: #ffcc00;
      --shadow: 0 12px 40px rgba(0,0,0,0.6);
      --btn-bg: #2a2a2a;
      --btn-text: #ccc;
      --btn-border: #444;
    }

    /* 浅色主题 (MBE 风格 · 明亮简约) */
    body.light-mode {
      --bg-color: #f7f9fc;
      --panel-bg: #ffffff;
      --text-main: #1a1a1a;
      --text-secondary: #5e5e5e;
      --border-color: #d0d7de;
      --accent-blue: #0066cc;
      --accent-yellow: #d4a300;
      --shadow: 0 12px 30px rgba(0,0,0,0.05), 0 2px 8px rgba(0,0,0,0.03);
      --btn-bg: #ffffff;
      --btn-text: #222;
      --btn-border: #c0c6cc;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      margin: 0;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    header {
      width: 100%;
      max-width: 1300px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 35px;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 2.6rem;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      margin: 0;
      font-weight: 400;
      color: var(--text-main);
    }

    .status {
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    .legend {
      display: flex;
      gap: 20px;
      align-items: center;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 18px;
      border-radius: 40px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.25s;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    #chart-container {
      width: 100%;
      max-width: 1300px;
      height: 620px;
      background: var(--panel-bg);
      padding: 20px 15px 5px 15px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transition: background-color 0.4s, border-color 0.4s;
      border-radius: 12px;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 15px;
      }
      h1 {
        font-size: 1.8rem;
      }
      #chart-container {
        height: 450px;
      }
    }
  </style>
</head>
<body class="dark-mode">

<header>
  <div>
    <h1>🎵 成绩追踪</h1>
    <div class="status" id="status-text">系统正常 · 实时同步</div>
  </div>
  <div style="display: flex; align-items: center; gap: 25px; flex-wrap: wrap;">
    <div class="legend">
      <span style="color: var(--accent-blue);">● MAIMAI</span>
      <span style="color: var(--accent-yellow);">● CHUNITHM</span>
    </div>
    <button class="theme-toggle-btn" id="theme-toggle" title="手动切换日间/夜间模式">
      <span id="theme-icon">🌙</span> <span id="theme-label">暗色</span>
    </button>
  </div>
</header>

<div id="chart-container"></div>

<div class="footer">STATION: GITHUB_IO &nbsp;|&nbsp; ENGINE: ECHARTS 5.0 &nbsp;|&nbsp; MBE STYLE</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
  (function() {
    const chartDom = document.getElementById('chart-container');
    let myChart = null;
    // 存储解析后的数据
    let maiData = [];
    let chuniData = [];

    // ---------- 主题管理 ----------
    const body = document.body;
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');

    // 当前主题模式：'dark' 或 'light'
    let currentMode = 'dark';
    // 自动检测是否被手动覆盖
    let manualOverride = false;

    function setThemeMode(mode) {
      if (mode === 'light') {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
        themeIcon.textContent = '☀️';
        themeLabel.textContent = '浅色';
        currentMode = 'light';
      } else {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
        themeIcon.textContent = '🌙';
        themeLabel.textContent = '暗色';
        currentMode = 'dark';
      }
      // 重新渲染图表以适配新主题
      renderChart();
    }

    // 手动切换
    themeToggleBtn.addEventListener('click', () => {
      manualOverride = true;
      setThemeMode(currentMode === 'dark' ? 'light' : 'dark');
    });

    // ---------- 日出日落自动检测 ----------
    async function getSunTimes(lat, lon) {
      try {
        const response = await fetch(
          `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lon}&formatted=0`
        );
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        if (data.status !== 'OK') throw new Error('Invalid response');
        return {
          sunrise: new Date(data.results.sunrise),
          sunset: new Date(data.results.sunset)
        };
      } catch (e) {
        console.warn('日出日落API失败，使用默认时间(6:00-18:00)', e);
        // 回退到固定时间（本地时间）
        const now = new Date();
        const sunrise = new Date(now);
        sunrise.setHours(6, 0, 0, 0);
        const sunset = new Date(now);
        sunset.setHours(18, 0, 0, 0);
        return { sunrise, sunset };
      }
    }

    function isDaytime(sunrise, sunset) {
      const now = new Date();
      return now >= sunrise && now < sunset;
    }

    async function applyAutoTheme() {
      if (manualOverride) return; // 用户手动切换后不再自动覆盖

      // 尝试获取地理位置
      let lat = 35.6895; // 默认东京
      let lon = 139.6917;

      try {
        if (navigator.geolocation) {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              timeout: 5000,
              maximumAge: 600000
            });
          });
          lat = position.coords.latitude;
          lon = position.coords.longitude;
        }
      } catch (e) {
        console.log('无法获取位置，使用默认坐标');
      }

      const { sunrise, sunset } = await getSunTimes(lat, lon);
      const daytime = isDaytime(sunrise, sunset);
      setThemeMode(daytime ? 'light' : 'dark');
    }

    // ---------- 数据加载 ----------
    async function fetchData(fileName) {
      try {
        const response = await fetch(fileName);
        if (!response.ok) throw new Error(`无法加载 ${fileName}`);
        const text = await response.text();
        return text.trim().split('\n').map(line => {
          const parts = line.split(' ');
          return {
            date: parts[0],
            value: parseFloat(parts[1])
          };
        }).filter(d => !isNaN(d.value) && d.date);
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    // ---------- 图表渲染 ----------
    function renderChart() {
      if (!maiData.length && !chuniData.length) return;

      // 销毁旧实例
      if (myChart) {
        myChart.dispose();
        myChart = null;
      }

      // 根据当前主题选择 ECharts 内置主题
      const echartsTheme = currentMode === 'light' ? undefined : 'dark'; // light 用默认(白底), dark 用内置'dark'
      myChart = echarts.init(chartDom, echartsTheme);

      // 合并所有日期并排序
      const allDatesSet = new Set();
      maiData.forEach(d => allDatesSet.add(d.date));
      chuniData.forEach(d => allDatesSet.add(d.date));
      const allDates = Array.from(allDatesSet).sort();

      // 准备系列数据 (ECharts 需要 [date, value] 格式，但使用 category 轴时，数据需按轴顺序对齐)
      // 简单方式：直接使用数据集或者 series 数据为 [date, value] 数组。
      // 这里采用 series.data 为 [date, value] 数组，xAxis.data 设为全日期，ECharts 会自动匹配。
      const option = {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'axis',
          backgroundColor: currentMode === 'light' ? 'rgba(255,255,255,0.95)' : 'rgba(20,20,20,0.95)',
          borderColor: currentMode === 'light' ? '#ccc' : '#444',
          textStyle: {
            color: currentMode === 'light' ? '#111' : '#eee',
            fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif'
          },
          axisPointer: {
            type: 'cross',
            crossStyle: { color: currentMode === 'light' ? '#aaa' : '#999' }
          }
        },
        grid: {
          left: '5%',
          right: '5%',
          bottom: '12%',
          top: '18%',
          containLabel: true
        },
        xAxis: {
          type: 'category',
          boundaryGap: false,
          data: allDates,
          axisLine: {
            lineStyle: { color: currentMode === 'light' ? '#bbb' : '#444', width: 1.5 }
          },
          axisLabel: {
            color: currentMode === 'light' ? '#333' : '#aaa',
            fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif',
            fontWeight: 500,
            rotate: 15,
            fontSize: 11
          }
        },
        yAxis: [
          {
            type: 'value',
            name: 'MAIMAI (Rating)',
            position: 'left',
            splitLine: {
              lineStyle: { color: currentMode === 'light' ? '#e0e0e0' : '#2a2a2a' }
            },
            axisLabel: {
              color: '#0095ff',
              fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif',
              fontWeight: 600
            },
            nameTextStyle: {
              color: '#0095ff',
              fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif',
              fontWeight: 600,
              padding: [0, 0, 8, 0]
            }
          },
          {
            type: 'value',
            name: 'CHUNITHM (Rating)',
            position: 'right',
            splitLine: { show: false },
            axisLabel: {
              color: '#ffcc00',
              fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif',
              fontWeight: 600
            },
            nameTextStyle: {
              color: '#ffcc00',
              fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif',
              fontWeight: 600,
              padding: [0, 0, 8, 0]
            }
          }
        ],
        dataZoom: [
          {
            type: 'inside',
            xAxisIndex: 0,
            zoomOnMouseWheel: true,
            moveOnMouseMove: true,
            moveOnMouseWheel: false
          },
          {
            type: 'slider',
            xAxisIndex: 0,
            bottom: 8,
            height: 22,
            borderColor: currentMode === 'light' ? '#ccc' : '#555',
            backgroundColor: currentMode === 'light' ? 'rgba(240,240,240,0.8)' : 'rgba(30,30,30,0.8)',
            dataBackground: {
              lineStyle: { color: currentMode === 'light' ? '#aaa' : '#666' },
              areaStyle: { color: currentMode === 'light' ? '#ddd' : '#444' }
            },
            selectedDataBackground: {
              lineStyle: { color: '#0095ff' },
              areaStyle: { color: 'rgba(0,149,255,0.15)' }
            },
            handleStyle: { color: '#0095ff' },
            textStyle: {
              color: currentMode === 'light' ? '#333' : '#ccc',
              fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif'
            }
          }
        ],
        series: [
          {
            name: 'maimai',
            type: 'line',
            yAxisIndex: 0,
            data: maiData.map(item => [item.date, item.value]),
            smooth: true,
            symbol: 'circle',
            symbolSize: 9,
            itemStyle: {
              color: '#0095ff',
              borderColor: currentMode === 'light' ? '#fff' : '#1a1a1a',
              borderWidth: 2,
              shadowBlur: 6,
              shadowColor: 'rgba(0,149,255,0.5)'
            },
            lineStyle: {
              width: 3.5,
              shadowBlur: 12,
              shadowColor: 'rgba(0,149,255,0.4)',
              cap: 'round'
            },
            areaStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: 'rgba(0,149,255,0.2)' },
                { offset: 1, color: 'rgba(0,149,255,0)' }
              ])
            },
            label: {
              show: true,
              position: 'top',
              color: '#0095ff',
              fontSize: 10,
              fontWeight: 'bold',
              fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif',
              formatter: function(params) {
                return params.value[1]; // 显示数值
              },
              // 开启防重叠 (ECharts 5.0+)
              labelLayout: {
                hideOverlap: true
              }
            },
            emphasis: {
              focus: 'series',
              label: { show: true, fontWeight: 'bold', fontSize: 12 }
            }
          },
          {
            name: 'chunithm',
            type: 'line',
            yAxisIndex: 1,
            data: chuniData.map(item => [item.date, item.value]),
            smooth: true,
            symbol: 'roundRect',
            symbolSize: 10,
            itemStyle: {
              color: '#ffcc00',
              borderColor: currentMode === 'light' ? '#fff' : '#1a1a1a',
              borderWidth: 2,
              shadowBlur: 6,
              shadowColor: 'rgba(255,204,0,0.5)'
            },
            lineStyle: {
              width: 3.5,
              shadowBlur: 12,
              shadowColor: 'rgba(255,204,0,0.4)',
              cap: 'round'
            },
            areaStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: 'rgba(255,204,0,0.15)' },
                { offset: 1, color: 'rgba(255,204,0,0)' }
              ])
            },
            label: {
              show: true,
              position: 'top',
              color: '#d4a300',
              fontSize: 10,
              fontWeight: 'bold',
              fontFamily: 'Josefin Sans, Futura, Century Gothic, sans-serif',
              formatter: function(params) {
                return params.value[1];
              },
              labelLayout: {
                hideOverlap: true
              }
            },
            emphasis: {
              focus: 'series',
              label: { show: true, fontWeight: 'bold', fontSize: 12 }
            }
          }
        ]
      };

      myChart.setOption(option);

      // 窗口大小自适应
      window.addEventListener('resize', () => {
        if (myChart) myChart.resize();
      });
    }

    // ---------- 初始化流程 ----------
    async function init() {
      // 并行加载数据
      const [mai, chuni] = await Promise.all([
        fetchData('maimai.txt'),
        fetchData('chunithm.txt')
      ]);
      maiData = mai;
      chuniData = chuni;

      if (maiData.length === 0 && chuniData.length === 0) {
        document.getElementById('status-text').textContent = '⚠️ 未找到数据文件 (maimai.txt / chunithm.txt)';
        return;
      }

      // 先应用自动主题（可能会改变 currentMode）
      await applyAutoTheme();

      // 初始渲染（applyAutoTheme 内部已调用 renderChart，但为确保数据加载后渲染，再次调用）
      // 注意避免重复渲染：applyAutoTheme 调用 setThemeMode -> renderChart，但那时数据可能尚未准备好？
      // 由于 await applyAutoTheme 在数据加载之后，所以数据已就绪。但 setThemeMode 会调用 renderChart，
      // 而 renderChart 会使用全局 maiData/chuniData。所以没问题。
      // 若自动主题设置未触发渲染（例如 manualOverride 为 true 且之前没有渲染），则手动调用一次。
      if (!myChart) {
        renderChart();
      }
    }

    init();
  })();
</script>
</body>
</html>
